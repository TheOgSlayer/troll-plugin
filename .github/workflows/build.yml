name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build plugin
        run: mvn -B package

      - name: Rebuild resource pack and print SHA-1
        run: |
          cd resource-pack && zip -qr ../TrollPack.zip . && cd ..
          echo "Resource pack SHA-1:" && sha1sum TrollPack.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TrollPlugin
          path: |
            target/TrollPlugin-*.jar
            TrollPack.zip

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/TrollPlugin-*.jar
            TrollPack.zip
